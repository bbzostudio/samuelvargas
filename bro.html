<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anceztral Records</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { margin: 0; background: #000; overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
    ::selection { background: rgba(200,16,46,0.4); color: #fff; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.4); border-radius: 99px; }
    select option { background: #111; color: #fff; }

    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes waveform { 0%, 100% { height: 8px; } 25% { height: 22px; } 50% { height: 5px; } 75% { height: 18px; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .hover-lift { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s ease; }
    .hover-lift:hover { transform: translateY(-8px); box-shadow: 0 24px 60px rgba(200,16,46,0.15); }
    .hover-glow { transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease; }
    .hover-glow:hover { border-color: rgba(200,16,46,0.45) !important; box-shadow: 0 0 40px rgba(200,16,46,0.1); }
    .text-gradient { background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .group:hover .group-hover-show { opacity: 1; transform: translateX(4px); }
    .group-hover-show { opacity: 0; transition: all 0.35s ease; }
    .tab-active-bar { position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: #c8102e; }
    .service-card:hover .service-line { width: 4rem; }
    .service-line { width: 0; height: 2px; background: #c8102e; transition: width 0.7s ease; }
    .nav-link { color: rgba(255,255,255,0.5); transition: color 0.3s; }
    .nav-link:hover { color: #fff; }
    .social-card:hover { border-color: rgba(200,16,46,0.4) !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── CONFIG ── */
    const LINKS = {
      samu: {
        spotify: "https://open.spotify.com/artist/2IfHdCurUyGRepjKTS02bd?si=fXUPRdSuS2K9M0Z4H3_P7A",
        trackIDontWanna: "https://open.spotify.com/track/I_DONT_WANNA_ID",
        trackSiVeo: "https://open.spotify.com/track/SI_VEO_A_TU_MAMA_ID",
        tiktok: "https://www.tiktok.com/@samuuuuuuuuuuv",
        instagram: "https://www.instagram.com/samuuuuuuuuuuv",
      },
      anceztro: {
        spotify: "https://open.spotify.com/artist/4WnkAAjLufrDjMN70ivLxg?si=P2bggYctQLu2_9uEjFS4pA",
        youtube: "https://www.youtube.com/@ANCEZTRO_CHANNEL",
        linktree: "https://linktr.ee/anceztro",
        tiktok: "https://www.tiktok.com/@anceztro",
        instagram: "https://www.instagram.com/anceztro",
      },
    };
    const EMAIL = "samuelv0103@gmail.com";
    const C = {
      accent: "#c8102e", bg: "#000000", bg2: "#080808", bg3: "#0d0d0d",
      border: "rgba(255,255,255,0.08)", borderLight: "rgba(255,255,255,0.13)",
      text2: "rgba(255,255,255,0.55)", text3: "rgba(255,255,255,0.22)",
    };

    /* ── HOOK: scroll reveal ── */
    function useReveal(threshold = 0.08) {
      const ref = useRef(null);
      const [v, setV] = useState(false);
      useEffect(() => {
        const el = ref.current; if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.unobserve(el); } }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, [threshold]);
      return [ref, v];
    }

    /* ── LOGO ── */
    function Logo({ size = 44, showText = false }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <svg width={size} height={size} viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="58" stroke={C.accent} strokeWidth="2.5"/>
            <circle cx="60" cy="60" r="48" stroke="rgba(255,255,255,0.04)" strokeWidth="0.8"/>
            <path d="M60 22L30 92H42L50 72H70L78 92H90L60 22Z" fill="#fff"/>
            <rect x="46" y="61" width="28" height="3.5" fill={C.accent} rx="1"/>
          </svg>
          {showText && (
            <div>
              <p style={{ color:"#fff", fontSize:13, fontWeight:700, letterSpacing:"0.4em", textTransform:"uppercase", lineHeight:1 }}>Anceztral</p>
              <p style={{ color:C.accent, fontSize:8, letterSpacing:"0.5em", textTransform:"uppercase", marginTop:4 }}>Records</p>
            </div>
          )}
        </div>
      );
    }

    /* ── WAVEFORM ── */
    function Waveform({ bars = 5, h = 24, color = C.accent }) {
      return (
        <div style={{ display:"flex", alignItems:"flex-end", gap:3, height:h }}>
          {Array.from({ length: bars }).map((_, i) => (
            <div key={i} style={{
              width:3, background:color, borderRadius:2,
              animation: `waveform ${0.8 + i * 0.15}s ease-in-out infinite`,
              animationDelay: `${i * 0.1}s`,
            }}/>
          ))}
        </div>
      );
    }

    /* ── AMBIENT ── */
    function Ambient() {
      return (
        <div style={{ position:"fixed", inset:0, pointerEvents:"none", overflow:"hidden", zIndex:0 }}>
          <div style={{
            position:"absolute", top:"-20%", left:"-10%",
            width:600, height:600, borderRadius:"50%", opacity:0.05,
            background:`radial-gradient(circle, ${C.accent}, transparent 70%)`,
            filter:"blur(100px)", animation:"float 12s ease-in-out infinite",
          }}/>
          <div style={{
            position:"absolute", bottom:"-20%", right:"-10%",
            width:500, height:500, borderRadius:"50%", opacity:0.04,
            background:`radial-gradient(circle, ${C.accent}, transparent 70%)`,
            filter:"blur(120px)", animation:"float 15s ease-in-out infinite reverse",
          }}/>
        </div>
      );
    }

    /* ── NAV ── */
    function Nav() {
      const [open, setOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const h = () => setScrolled(window.scrollY > 60);
        window.addEventListener("scroll", h, { passive: true });
        return () => window.removeEventListener("scroll", h);
      }, []);
      const links = [
        { label:"Servicios", href:"#services" },
        { label:"Artistas", href:"#artists" },
        { label:"Música", href:"#catalog" },
        { label:"Redes", href:"#social" },
        { label:"Contacto", href:"#contact" },
      ];
      return (
        <nav style={{
          position:"fixed", top:0, left:0, right:0, zIndex:50,
          background: scrolled ? "rgba(0,0,0,0.93)" : "transparent",
          backdropFilter: scrolled ? "blur(30px) saturate(180%)" : "none",
          borderBottom: scrolled ? `1px solid ${C.border}` : "none",
          transition:"all 0.7s ease",
        }}>
          <div style={{ maxWidth:1440, margin:"0 auto", padding:"0 48px", height:88, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <a href="#hero"><Logo size={36} showText /></a>
            <div style={{ display:"flex", alignItems:"center", gap:40 }} className="desktop-nav">
              {links.map(l => (
                <a key={l.href} href={l.href} className="nav-link"
                  style={{ fontSize:11, letterSpacing:"0.22em", textTransform:"uppercase", fontWeight:600, textDecoration:"none" }}>
                  {l.label}
                </a>
              ))}
              <a href="#contact"
                style={{ fontSize:11, letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:700, padding:"14px 28px", background:C.accent, color:"#fff", textDecoration:"none", transition:"opacity 0.3s" }}
                onMouseEnter={e=>e.target.style.opacity="0.85"} onMouseLeave={e=>e.target.style.opacity="1"}>
                Trabaja Con Nosotros
              </a>
            </div>
          </div>
          <style>{`
            @media (max-width: 1024px) { .desktop-nav { display: none !important; } }
          `}</style>
        </nav>
      );
    }

    /* ── HERO ── */
    function Hero() {
      const [loaded, setLoaded] = useState(false);
      useEffect(() => { requestAnimationFrame(() => setLoaded(true)); }, []);
      const fadeStyle = (delay = 0) => ({
        transition: `opacity 1.6s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 1.6s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
        opacity: loaded ? 1 : 0,
        transform: loaded ? "translateY(0)" : "translateY(50px)",
      });

      return (
        <section id="hero" style={{ position:"relative", minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", background:C.bg, overflow:"hidden" }}>
          {/* Top accent line */}
          <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:`linear-gradient(90deg, transparent, ${C.accent}, transparent)` }}/>

          {/* Grid overlay */}
          <div style={{
            position:"absolute", inset:0, pointerEvents:"none",
            backgroundImage:`linear-gradient(${C.border} 1px, transparent 1px), linear-gradient(90deg, ${C.border} 1px, transparent 1px)`,
            backgroundSize:"80px 80px", opacity:0.12,
          }}/>

          {/* Giant watermark */}
          <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none", overflow:"hidden", userSelect:"none" }}>
            <span style={{
              fontSize:"21vw", fontWeight:900, letterSpacing:"-0.06em", whiteSpace:"nowrap",
              color:"rgba(255,255,255,0.016)", fontFamily:"'Space Grotesk','Inter',sans-serif",
              transition:"opacity 3s", opacity: loaded ? 1 : 0,
            }}>ANCEZTRAL</span>
          </div>

          <div style={{ maxWidth:1440, margin:"0 auto", width:"100%", padding:"160px 48px 100px", position:"relative", zIndex:10 }}>
            {/* Badge */}
            <div style={fadeStyle(0)}>
              <div style={{
                display:"inline-flex", alignItems:"center", gap:12,
                padding:"10px 20px", borderRadius:999, marginBottom:44,
                background:"rgba(200,16,46,0.08)", border:`1px solid rgba(200,16,46,0.2)`,
              }}>
                <Waveform bars={4} h={16} />
                <span style={{ fontSize:11, letterSpacing:"0.3em", textTransform:"uppercase", fontWeight:600, color:C.accent }}>
                  Sello Discográfico &amp; Productora Musical
                </span>
              </div>
            </div>

            {/* Main title */}
            <div style={fadeStyle(0.12)}>
              <h1 style={{
                fontFamily:"'Space Grotesk','Inter',sans-serif", fontWeight:900,
                fontSize:"clamp(5rem,14vw,15rem)", lineHeight:0.83, letterSpacing:"-0.055em", marginBottom:"-0.04em",
              }}>
                <span className="text-gradient">ANCEZ</span><span style={{ color:C.accent }}>T</span><span className="text-gradient">RAL</span>
              </h1>
            </div>
            <div style={fadeStyle(0.26)}>
              <h1 style={{
                fontFamily:"'Space Grotesk','Inter',sans-serif", fontWeight:900,
                fontSize:"clamp(5rem,14vw,15rem)", lineHeight:0.83, letterSpacing:"-0.055em",
                color:"transparent", WebkitTextStroke:`2px ${C.accent}`,
              }}>
                RECORDS
              </h1>
            </div>

            {/* Tagline + CTAs */}
            <div style={{ ...fadeStyle(0.5), marginTop:72, display:"flex", flexWrap:"wrap", justifyContent:"space-between", alignItems:"flex-end", gap:32 }}>
              <p style={{ fontSize:"clamp(15px,1.4vw,20px)", lineHeight:1.8, maxWidth:480, color:C.text2, fontWeight:300 }}>
                Donde el arte se convierte en <strong style={{ color:"#fff", fontWeight:600 }}>legado</strong>.
                <br/>Producción, mezcla, mastering y management bajo un mismo techo.
              </p>
              <div style={{ display:"flex", flexWrap:"wrap", gap:14 }}>
                <a href={LINKS.anceztro.spotify} target="_blank" rel="noopener noreferrer"
                  style={{ display:"inline-flex", alignItems:"center", gap:12, padding:"18px 36px", background:C.accent, color:"#fff", fontSize:12, fontWeight:700, letterSpacing:"0.2em", textTransform:"uppercase", textDecoration:"none", transition:"opacity 0.3s" }}
                  onMouseEnter={e=>e.currentTarget.style.opacity="0.85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                  Escuchar Música →
                </a>
                <a href={LINKS.anceztro.linktree} target="_blank" rel="noopener noreferrer"
                  style={{ display:"inline-flex", alignItems:"center", gap:12, padding:"18px 36px", color:C.text2, fontSize:12, fontWeight:600, letterSpacing:"0.2em", textTransform:"uppercase", textDecoration:"none", border:`1px solid ${C.borderLight}`, transition:"all 0.4s" }}
                  onMouseEnter={e=>{ e.currentTarget.style.borderColor="rgba(200,16,46,0.5)"; e.currentTarget.style.color="#fff"; }}
                  onMouseLeave={e=>{ e.currentTarget.style.borderColor=C.borderLight; e.currentTarget.style.color=C.text2; }}>
                  Linktree ↗
                </a>
              </div>
            </div>
          </div>

          {/* Scroll cue */}
          <div style={{ position:"absolute", bottom:36, left:"50%", transform:"translateX(-50%)", display:"flex", flexDirection:"column", alignItems:"center", gap:8, opacity:0.3, transition:"opacity 3s 1.5s", ...(loaded ? {opacity:0.3} : {opacity:0}) }}>
            <div style={{ width:1, height:40, background:"rgba(255,255,255,0.25)" }}/>
            <span style={{ fontSize:9, letterSpacing:"0.3em", textTransform:"uppercase", color:C.text3 }}>scroll</span>
          </div>
        </section>
      );
    }

    /* ── MARQUEE ── */
    function MarqueeStrip() {
      const t = "PRODUCCIÓN \u00A0•\u00A0 MEZCLA \u00A0•\u00A0 MASTERING \u00A0•\u00A0 MANAGEMENT \u00A0•\u00A0 DESARROLLO ARTÍSTICO \u00A0•\u00A0 360° \u00A0•\u00A0 ";
      return (
        <div style={{ overflow:"hidden", padding:"22px 0", background:C.accent }}>
          <div style={{ display:"flex", whiteSpace:"nowrap", animation:"marquee 22s linear infinite" }}>
            <span style={{ fontSize:"clamp(12px,1.1vw,15px)", letterSpacing:"0.4em", textTransform:"uppercase", fontWeight:700, color:"#fff" }}>
              {t}{t}{t}{t}{t}{t}
            </span>
          </div>
        </div>
      );
    }

    /* ── ABOUT ── */
    function About() {
      const [ref, v] = useReveal();
      const trans = (delay=0) => ({ transition:`opacity 1.4s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 1.4s cubic-bezier(0.16,1,0.3,1) ${delay}s`, opacity:v?1:0, transform:v?"translateY(0)":"translateY(50px)" });
      return (
        <section style={{ position:"relative", padding:"clamp(120px,12vw,200px) 48px", background:C.bg2, overflow:"hidden" }}>
          {/* Decorative 360 */}
          <div style={{ position:"absolute", top:40, right:60, fontSize:"clamp(14rem,22vw,32rem)", fontWeight:900, lineHeight:1, pointerEvents:"none", userSelect:"none", color:"rgba(255,255,255,0.012)" }}>360</div>

          <div ref={ref} style={{ maxWidth:1100, margin:"0 auto", position:"relative", zIndex:1 }}>
            <div style={trans(0)}>
              <div style={{ display:"flex", justifyContent:"center", marginBottom:56 }}>
                <Logo size={64} />
              </div>
              <h2 style={{ textAlign:"center", fontFamily:"'Instrument Serif',serif", fontSize:"clamp(2rem,5vw,5rem)", lineHeight:1.25, letterSpacing:"-0.01em" }}>
                No hacemos música.
                <br/><span style={{ color:C.accent }}>Creamos legados.</span>
              </h2>
            </div>
            <div style={{ ...trans(0.2), maxWidth:720, margin:"48px auto 0", textAlign:"center" }}>
              <p style={{ fontSize:"clamp(15px,1.3vw,19px)", lineHeight:2.0, color:C.text2 }}>
                Anceztral Records es un ecosistema completo para artistas que se rehúsan a ser ordinarios.
                Desde la primera nota hasta el escenario mundial, cada decisión está diseñada para construir carreras que trasciendan generaciones.
              </p>
            </div>
            {/* Stats */}
            <div style={{ ...trans(0.4), display:"grid", gridTemplateColumns:"repeat(3,1fr)", marginTop:"clamp(60px,8vw,100px)", borderTop:`1px solid ${C.border}`, paddingTop:"clamp(40px,5vw,60px)" }}>
              {[
                { val:"360°", label:"Servicio Integral" },
                { val:"100%", label:"Independiente" },
                { val:"∞", label:"Visión Sin Límites" },
              ].map((s,i) => (
                <div key={i} style={{ textAlign:"center", padding:"32px 20px", borderLeft: i>0 ? `1px solid ${C.border}` : "none" }}>
                  <p style={{ fontSize:"clamp(2.5rem,5vw,4rem)", fontWeight:900, letterSpacing:"-0.03em" }}>{s.val}</p>
                  <p style={{ fontSize:11, letterSpacing:"0.28em", textTransform:"uppercase", marginTop:14, color:C.text3, fontWeight:500 }}>{s.label}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── SERVICES ── */
    const SERVICES = [
      { title:"Producción Musical", desc:"Dirección artística y producción de vanguardia. Cada beat, cada arreglo, diseñado para trascender géneros y generaciones.", num:"01", grad:"linear-gradient(135deg,rgba(200,16,46,0.1) 0%,transparent 60%)" },
      { title:"Artista & Desarrollo", desc:"Branding, estrategia de lanzamiento y crecimiento sostenible. Construimos carreras que el mundo no puede ignorar.", num:"02", grad:"linear-gradient(135deg,rgba(212,168,83,0.07) 0%,transparent 60%)" },
      { title:"Ingeniero de Mezcla", desc:"Mezclas cristalinas y competitivas a nivel internacional. Cada frecuencia en su lugar, cada emoción amplificada.", num:"03", grad:"linear-gradient(135deg,rgba(200,16,46,0.07) 0%,transparent 60%)" },
      { title:"Ingeniero de Mastering", desc:"Loudness, claridad y potencia. El sello final de calidad que lleva tu sonido a estándares de industria global.", num:"04", grad:"linear-gradient(135deg,rgba(212,168,83,0.05) 0%,transparent 60%)" },
    ];

    function Services() {
      const [ref, v] = useReveal();
      return (
        <section id="services" style={{ padding:"clamp(120px,12vw,200px) 48px", background:C.bg }}>
          <div ref={ref} style={{ maxWidth:1440, margin:"0 auto" }}>
            <div style={{ display:"flex", flexWrap:"wrap", justifyContent:"space-between", alignItems:"flex-end", gap:32, marginBottom:"clamp(60px,8vw,100px)", transition:"all 1s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(40px)" }}>
              <div>
                <p style={{ fontSize:12, letterSpacing:"0.5em", textTransform:"uppercase", fontWeight:600, color:C.accent, marginBottom:22 }}>Ecosistema 360°</p>
                <h2 style={{ fontSize:"clamp(2.5rem,6.5vw,7rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:0.95 }}>
                  Nuestros<br/><span style={{ color:C.accent }}>Servicios</span>
                </h2>
              </div>
              <p style={{ fontSize:"clamp(14px,1.2vw,18px)", lineHeight:1.85, maxWidth:420, color:C.text2, paddingBottom:8 }}>
                Todo lo que un artista necesita para dominar la industria. Sin intermediarios, sin compromisos, sin límites.
              </p>
            </div>

            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(420px, 1fr))", gap:20 }}>
              {SERVICES.map((s, i) => (
                <div key={i} className="hover-lift hover-glow service-card"
                  style={{
                    position:"relative", padding:"clamp(40px,4vw,60px)", background:C.bg3,
                    border:`1px solid ${C.border}`, overflow:"hidden", cursor:"default",
                    transition:`opacity 0.8s ease ${i*0.12}s, transform 0.8s ease ${i*0.12}s, box-shadow 0.5s ease, border-color 0.4s ease`,
                    opacity:v?1:0, transform:v?"translateY(0)":"translateY(30px)",
                  }}>
                  <div style={{ position:"absolute", inset:0, background:s.grad, pointerEvents:"none" }}/>
                  <div style={{ position:"absolute", top:20, right:28, fontSize:"clamp(60px,8vw,120px)", fontWeight:900, lineHeight:1, color:"rgba(255,255,255,0.025)", pointerEvents:"none", userSelect:"none" }}>{s.num}</div>
                  <div style={{ position:"relative", zIndex:1 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:28 }}>
                      <span style={{ fontSize:11, fontFamily:"monospace", color:C.text3 }}>{s.num}</span>
                    </div>
                    <h3 style={{ fontSize:"clamp(1.4rem,2.2vw,2rem)", fontWeight:900, letterSpacing:"-0.02em", marginBottom:18 }}>{s.title}</h3>
                    <p style={{ fontSize:"clamp(13px,1.1vw,15px)", lineHeight:1.9, color:C.text2 }}>{s.desc}</p>
                    <div className="service-line" style={{ marginTop:28 }}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── ARTISTS ── */
    function Artists() {
      const [ref, v] = useReveal();
      const artists = [
        { name:"SAMU", role:"Artista / Productor", spotify:LINKS.samu.spotify, ig:LINKS.samu.instagram, igHandle:"@samuuuuuuuuuuv", tiktok:LINKS.samu.tiktok },
        { name:"ANCEZTRO", role:"Productor / Ingeniero", spotify:LINKS.anceztro.spotify, ig:LINKS.anceztro.instagram, igHandle:"@anceztro", tiktok:LINKS.anceztro.tiktok },
      ];
      return (
        <section id="artists" style={{ padding:"clamp(120px,12vw,200px) 48px", background:C.bg2 }}>
          <div ref={ref} style={{ maxWidth:1440, margin:"0 auto" }}>
            <div style={{ marginBottom:"clamp(60px,8vw,100px)", transition:"all 1s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(40px)" }}>

              <h2 style={{ fontSize:"clamp(2.5rem,6.5vw,7rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:0.95 }}>
                Nuestros<br/><span style={{ color:C.accent }}>Artistas</span>
              </h2>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(400px,1fr))", gap:24 }}>
              {artists.map((a,i) => (
                <div key={i} className="hover-glow"
                  style={{
                    position:"relative", padding:"clamp(40px,4vw,56px)", background:C.bg, border:`1px solid ${C.border}`,
                    overflow:"hidden", transition:`opacity 0.8s ease ${i*0.15}s, transform 0.8s ease ${i*0.15}s, border-color 0.4s ease`,

                  <div style={{ position:"absolute", top:0, right:0, fontSize:"clamp(10rem,16vw,22rem)", fontWeight:900, lineHeight:1, color:"rgba(200,16,46,0.03)", transform:"translate(10%,-5%)", pointerEvents:"none", userSelect:"none" }}>{a.name[0]}</div>
                  <div style={{ position:"relative", zIndex:1 }}>
                    <div style={{ marginBottom:28 }}><Waveform bars={7} h={26} /></div>
                    <p style={{ fontSize:11, letterSpacing:"0.4em", textTransform:"uppercase", fontWeight:600, color:C.accent, marginBottom:10 }}>{a.role}</p>

                    <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
                      <a href={a.spotify} target="_blank" rel="noopener noreferrer"
                        style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"12px 22px", background:"rgba(29,185,84,0.1)", color:"#1DB954", border:"1px solid rgba(29,185,84,0.18)", fontSize:11, letterSpacing:"0.15em", textTransform:"uppercase", fontWeight:700, textDecoration:"none", transition:"opacity 0.3s" }}
                        onMouseEnter={e=>e.currentTarget.style.opacity="0.75"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                        ♫ Spotify
                      </a>
                      <a href={a.ig} target="_blank" rel="noopener noreferrer"
                        style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"12px 22px", color:C.text2, border:`1px solid ${C.border}`, fontSize:11, letterSpacing:"0.15em", textTransform:"uppercase", fontWeight:600, textDecoration:"none", transition:"all 0.3s" }}
                        onMouseEnter={e=>{ e.currentTarget.style.borderColor="rgba(200,16,46,0.45)"; e.currentTarget.style.color="#fff"; }}
                        onMouseLeave={e=>{ e.currentTarget.style.borderColor=C.border; e.currentTarget.style.color=C.text2; }}>
                        IG {a.igHandle}
                      </a>
                      <a href={a.tiktok} target="_blank" rel="noopener noreferrer"
                        style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"12px 22px", color:C.text2, border:`1px solid ${C.border}`, fontSize:11, letterSpacing:"0.15em", textTransform:"uppercase", fontWeight:600, textDecoration:"none", transition:"all 0.3s" }}
                        onMouseEnter={e=>{ e.currentTarget.style.borderColor="rgba(200,16,46,0.45)"; e.currentTarget.style.color="#fff"; }}
                        onMouseLeave={e=>{ e.currentTarget.style.borderColor=C.border; e.currentTarget.style.color=C.text2; }}>
                        TikTok
                      </a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── CATALOG ── */
    function Catalog() {
      const [ref, v] = useReveal();
      const [tab, setTab] = useState("samu");
      const tracks_samu = [
        { title:"I DON'T WANNA", type:"Single", link:LINKS.samu.trackIDontWanna },
        { title:"Si Veo a Tu Mamá — DJ Afro Remix", type:"Remix", link:LINKS.samu.trackSiVeo },
      ];
      const links_anceztro = [
        { title:"Discografía Completa", sub:"Spotify", link:LINKS.anceztro.spotify, ic:"#1DB954" },
        { title:"Canal Oficial", sub:"YouTube", link:LINKS.anceztro.youtube, ic:"#ff0000" },
        { title:"Todo en un Lugar", sub:"Linktree", link:LINKS.anceztro.linktree, ic:C.accent },
      ];

      return (
        <section id="catalog" style={{ padding:"clamp(120px,12vw,200px) 48px", background:C.bg }}>
          <div ref={ref} style={{ maxWidth:1000, margin:"0 auto" }}>
            <div style={{ marginBottom:60, transition:"all 1s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(40px)" }}>
              <p style={{ fontSize:12, letterSpacing:"0.5em", textTransform:"uppercase", fontWeight:600, color:C.accent, marginBottom:22 }}>Catálogo</p>
              <h2 style={{ fontSize:"clamp(2.5rem,6.5vw,7rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:0.95 }}>
                Nuestra <span style={{ color:C.accent }}>Música</span>
              </h2>
            </div>

            {/* Tabs */}
            <div style={{ display:"flex", borderBottom:`2px solid ${C.border}`, marginBottom:52, transition:"all 0.7s", opacity:v?1:0 }}>
              {["samu","anceztro"].map(t => (
                <button key={t} onClick={() => setTab(t)}
                  style={{
                    position:"relative", padding:"18px 32px", fontSize:"clamp(13px,1.2vw,16px)",
                    fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase",
                    background:"transparent", border:"none", cursor:"pointer",
                    color: tab===t ? "#fff" : C.text3, transition:"color 0.3s",
                  }}>
                  {t.toUpperCase()}
                  {tab===t && <div className="tab-active-bar"/>}
                </button>
              ))}
            </div>

            {/* SAMU */}
            {tab==="samu" && tracks_samu.map((t,i) => (
              <a key={i} href={t.link} target="_blank" rel="noopener noreferrer" className="group"
                style={{ display:"flex", alignItems:"center", gap:24, padding:"28px 16px", borderBottom:`1px solid ${C.border}`, textDecoration:"none", transition:"background 0.3s", cursor:"pointer" }}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(200,16,46,0.05)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <span style={{ fontSize:13, fontFamily:"monospace", width:36, textAlign:"center", color:C.text3 }}>{String(i+1).padStart(2,"0")}</span>
                <div style={{ width:48, height:48, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, background:`rgba(200,16,46,0.1)`, border:`1px solid rgba(200,16,46,0.15)` }}>
                  <span style={{ color:C.accent, fontSize:16 }}>▶</span>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <p style={{ fontSize:"clamp(15px,1.5vw,20px)", fontWeight:700 }}>{t.title}</p>
                  <p style={{ fontSize:12, marginTop:4, color:C.text3 }}>{t.type}</p>
                </div>
                <span className="group-hover-show" style={{ color:C.accent, fontSize:20 }}>↗</span>
              </a>
            ))}
            {tab==="samu" && (
              <a href={LINKS.samu.spotify} target="_blank" rel="noopener noreferrer"
                style={{ display:"inline-flex", alignItems:"center", gap:10, marginTop:36, fontSize:11, letterSpacing:"0.2em", textTransform:"uppercase", fontWeight:700, color:C.accent, textDecoration:"none", transition:"opacity 0.3s" }}
                onMouseEnter={e=>e.currentTarget.style.opacity="0.7"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                Ver todo en Spotify →
              </a>
            )}

            {/* ANCEZTRO */}
            {tab==="anceztro" && links_anceztro.map((item,i) => (
              <a key={i} href={item.link} target="_blank" rel="noopener noreferrer" className="group"
                style={{ display:"flex", alignItems:"center", gap:24, padding:"28px 16px", borderBottom:`1px solid ${C.border}`, textDecoration:"none", transition:"background 0.3s" }}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(200,16,46,0.05)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <span style={{ fontSize:13, fontFamily:"monospace", width:36, textAlign:"center", color:C.text3 }}>{String(i+1).padStart(2,"0")}</span>
                <div style={{ width:48, height:48, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, background:`${item.ic}12`, border:`1px solid ${item.ic}18` }}>
                  <span style={{ color:item.ic, fontSize:18 }}>●</span>
                </div>
                <div style={{ flex:1 }}>
                  <p style={{ fontSize:"clamp(15px,1.5vw,20px)", fontWeight:700 }}>{item.title}</p>
                  <p style={{ fontSize:12, marginTop:4, color:C.text3 }}>{item.sub}</p>
                </div>
                <span className="group-hover-show" style={{ color:C.accent, fontSize:20 }}>↗</span>
              </a>
            ))}
          </div>
        </section>
      );
    }

    /* ── SOCIAL ── */
    const SOCIALS = [
      { platform:"Instagram", handle:"@anceztro", link:LINKS.anceztro.instagram, artist:"ANCEZTRO" },
      { platform:"TikTok", handle:"@anceztro", link:LINKS.anceztro.tiktok, artist:"ANCEZTRO" },
      { platform:"Instagram", handle:"@samuuuuuuuuuuv", link:LINKS.samu.instagram, artist:"SAMU" },
      { platform:"TikTok", handle:"@samuuuuuuuuuuv", link:LINKS.samu.tiktok, artist:"SAMU" },
    ];

    function Social() {
      const [ref, v] = useReveal();
      return (
        <section id="social" style={{ padding:"clamp(120px,12vw,200px) 48px", background:C.bg2 }}>
          <div ref={ref} style={{ maxWidth:1440, margin:"0 auto" }}>
            <div style={{ marginBottom:"clamp(60px,8vw,100px)", transition:"all 1s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(40px)" }}>
              <p style={{ fontSize:12, letterSpacing:"0.5em", textTransform:"uppercase", fontWeight:600, color:C.accent, marginBottom:22 }}>Comunidad</p>
              <h2 style={{ fontSize:"clamp(2.5rem,6.5vw,7rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:0.95 }}>
                Nuestras <span style={{ color:C.accent }}>Redes</span>
              </h2>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))", gap:18 }}>
              {SOCIALS.map((s,i) => (
                <a key={i} href={s.link} target="_blank" rel="noopener noreferrer" className="hover-lift social-card"
                  style={{
                    display:"block", position:"relative", padding:"clamp(32px,3.5vw,44px)", background:C.bg3,
                    border:`1px solid ${C.border}`, textDecoration:"none", overflow:"hidden",
                    transition:`opacity 0.7s ease ${i*0.1}s, transform 0.7s ease, box-shadow 0.5s, border-color 0.4s`,
                    opacity:v?1:0,
                  }}>
                  <div style={{ position:"absolute", bottom:-24, right:-24, fontSize:140, opacity:0.025, lineHeight:1, userSelect:"none", pointerEvents:"none" }}>
                    {s.platform==="Instagram" ? "◈" : "▶"}
                  </div>
                  <div style={{ position:"relative", zIndex:1 }}>
                    <div style={{ width:48, height:48, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:28, background:`${C.accent}10`, border:`1px solid ${C.accent}18`, fontSize:22, color:C.accent }}>
                      {s.platform==="Instagram" ? "◈" : "▶"}
                    </div>
                    <p style={{ fontSize:9, letterSpacing:"0.35em", textTransform:"uppercase", fontWeight:600, color:C.text3, marginBottom:8 }}>{s.artist} • {s.platform}</p>
                    <p style={{ fontSize:"clamp(1.1rem,1.8vw,1.5rem)", fontWeight:700, letterSpacing:"-0.01em" }}>{s.handle}</p>
                    <p style={{ fontSize:11, marginTop:8, color:C.text3 }}>{s.platform}</p>
                  </div>
                </a>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── CTA BANNER ── */
    function CtaBanner() {
      const [ref, v] = useReveal();
      return (
        <section style={{ position:"relative", padding:"clamp(100px,10vw,160px) 48px", background:C.accent, overflow:"hidden" }}>
          <div style={{
            position:"absolute", inset:0, backgroundImage:"linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px)",
            backgroundSize:"60px 60px", pointerEvents:"none",
          }}/>
          <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none", overflow:"hidden", userSelect:"none" }}>
            <span style={{ fontSize:"18vw", fontWeight:900, letterSpacing:"-0.06em", whiteSpace:"nowrap", color:"rgba(0,0,0,0.1)" }}>BOOKING</span>
          </div>
          <div ref={ref} style={{ maxWidth:1000, margin:"0 auto", textAlign:"center", position:"relative", zIndex:1, transition:"all 1.2s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(50px)" }}>
            <h2 style={{ fontSize:"clamp(2.5rem,6vw,6.5rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:1, color:"#fff" }}>
              ¿Listo para crear algo legendario?
            </h2>
            <p style={{ marginTop:28, fontSize:"clamp(15px,1.3vw,19px)", lineHeight:1.85, color:"rgba(255,255,255,0.72)" }}>
              Artistas, productores, marcas — estamos buscando al próximo talento que defina una generación.
            </p>
            <a href="#contact"
              style={{ display:"inline-flex", alignItems:"center", gap:14, marginTop:44, padding:"20px 44px", background:"#000", color:"#fff", fontSize:13, fontWeight:700, letterSpacing:"0.2em", textTransform:"uppercase", textDecoration:"none", transition:"opacity 0.3s" }}
              onMouseEnter={e=>e.currentTarget.style.opacity="0.8"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
              Contáctanos →
            </a>
          </div>
        </section>
      );
    }

    /* ── CONTACT ── */
    function Contact() {
      const [ref, v] = useReveal();
      const [sent, setSent] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        const fd = new FormData(e.target);
        try {
          await fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
            method:"POST",
            headers:{ "Content-Type":"application/json", Accept:"application/json" },
            body: JSON.stringify({
              Nombre: fd.get("name"), Email: fd.get("email"),
              Servicio: fd.get("service"), Mensaje: fd.get("message"),
              _subject: "Nuevo mensaje — Anceztral Records",
            }),
          });
          setSent(true); e.target.reset();
          setTimeout(() => setSent(false), 6000);
        } catch { alert("Error al enviar. Intenta de nuevo."); }
        setLoading(false);
      };

      const fieldSt = { width:"100%", background:"rgba(255,255,255,0.04)", border:`1px solid ${C.border}`, color:"#fff", outline:"none", padding:"18px 22px", fontSize:15, fontFamily:"inherit", transition:"border-color 0.4s, background 0.4s", borderRadius:2 };
      const onFocus = e => { e.target.style.borderColor="rgba(200,16,46,0.5)"; e.target.style.background="rgba(255,255,255,0.07)"; };
      const onBlur = e => { e.target.style.borderColor=C.border; e.target.style.background="rgba(255,255,255,0.04)"; };

      return (
        <section id="contact" style={{ padding:"clamp(120px,12vw,200px) 48px", background:C.bg }}>
          <div ref={ref} style={{ maxWidth:750, margin:"0 auto" }}>
            <div style={{ marginBottom:60, transition:"all 1s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(40px)" }}>
              <p style={{ fontSize:12, letterSpacing:"0.5em", textTransform:"uppercase", fontWeight:600, color:C.accent, marginBottom:22 }}>Contacto &amp; Booking</p>
              <h2 style={{ fontSize:"clamp(2.5rem,6vw,5.5rem)", fontWeight:900, letterSpacing:"-0.04em", lineHeight:1 }}>
                Trabajemos<br/><span style={{ color:C.accent }}>Juntos</span>
              </h2>
              <p style={{ marginTop:20, fontSize:"clamp(14px,1.1vw,17px)", lineHeight:1.8, color:C.text2 }}>¿Tienes un proyecto en mente? Escríbenos y hagamos que suene increíble.</p>
            </div>

            {sent ? (
              <div style={{ textAlign:"center", padding:"80px 0", transition:"all 0.7s", opacity:v?1:0 }}>
                <div style={{ width:80, height:80, margin:"0 auto 28px", display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(200,16,46,0.1)", border:"1px solid rgba(200,16,46,0.2)", fontSize:32, color:C.accent }}>✓</div>
                <p style={{ fontSize:"clamp(1.5rem,3vw,2rem)", fontWeight:900, marginBottom:10 }}>Mensaje Enviado</p>
                <p style={{ fontSize:15, color:C.text2 }}>Te responderemos lo antes posible.</p>
              </div>
            ) : (
              <form onSubmit={handleSubmit} style={{ transition:"all 1s 0.2s", opacity:v?1:0, transform:v?"translateY(0)":"translateY(30px)" }}>
                <input type="text" name="_honey" style={{ display:"none" }}/>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
                  <input name="name" type="text" placeholder="Tu nombre" required style={fieldSt} onFocus={onFocus} onBlur={onBlur}/>
                  <input name="email" type="email" placeholder="Email" required style={fieldSt} onFocus={onFocus} onBlur={onBlur}/>
                </div>
                <div style={{ position:"relative", marginBottom:16 }}>
                  <select name="service" required style={{ ...fieldSt, appearance:"none", cursor:"pointer", color:C.text2 }} onFocus={onFocus} onBlur={onBlur}>
                    <option value="" disabled selected>Servicio que necesitas</option>
                    <option value="Producción Musical">Producción Musical</option>
                    <option value="Mezcla">Mezcla</option>
                    <option value="Mastering">Mastering</option>
                    <option value="Management & Desarrollo">Management &amp; Desarrollo</option>
                    <option value="Paquete 360°">Paquete 360°</option>
                    <option value="Otro">Otro</option>
                  </select>
                  <span style={{ position:"absolute", right:20, top:"50%", transform:"translateY(-50%)", color:C.text3, pointerEvents:"none" }}>⌄</span>
                </div>
                <textarea name="message" placeholder="Cuéntanos sobre tu proyecto..." rows={5} required style={{ ...fieldSt, resize:"none", marginBottom:24 }} onFocus={onFocus} onBlur={onBlur}/>
                <button type="submit" disabled={loading}
                  style={{ width:"100%", display:"flex", alignItems:"center", justifyContent:"center", gap:14, padding:"20px", background:C.accent, color:"#fff", fontSize:13, fontWeight:700, letterSpacing:"0.2em", textTransform:"uppercase", border:"none", borderRadius:2, cursor:"pointer", opacity:loading?0.6:1, transition:"opacity 0.3s" }}
                  onMouseEnter={e=>!loading && (e.target.style.opacity="0.88")} onMouseLeave={e=>!loading && (e.target.style.opacity="1")}>
                  ✉ {loading ? "Enviando..." : "Enviar Mensaje"} →
                </button>
              </form>
            )}
          </div>
        </section>
      );
    }

    /* ── FOOTER ── */
    function Footer() {
      return (
        <footer style={{ padding:"80px 48px", background:C.bg3, borderTop:`1px solid ${C.border}` }}>
          <div style={{ maxWidth:1440, margin:"0 auto" }}>
            <div style={{ display:"flex", flexWrap:"wrap", justifyContent:"space-between", alignItems:"flex-start", gap:48, marginBottom:60 }}>
              <Logo size={52} showText />
              <div style={{ display:"flex", gap:64, flexWrap:"wrap" }}>
                <div>
                  <p style={{ fontSize:10, letterSpacing:"0.3em", textTransform:"uppercase", fontWeight:600, color:C.text3, marginBottom:20 }}>Navegación</p>
                  {["Servicios","Artistas","Música","Contacto"].map(l => (
                    <a key={l} href={`#${l.toLowerCase()==="música"?"catalog":l.toLowerCase()}`}
                      style={{ display:"block", fontSize:14, color:C.text2, textDecoration:"none", marginBottom:12, transition:"color 0.3s" }}
                      onMouseEnter={e=>e.target.style.color="#fff"} onMouseLeave={e=>e.target.style.color=C.text2}>{l}</a>
                  ))}
                </div>
                <div>
                  <p style={{ fontSize:10, letterSpacing:"0.3em", textTransform:"uppercase", fontWeight:600, color:C.text3, marginBottom:20 }}>Conecta</p>
                  {[
                    { l:"Instagram", h:LINKS.anceztro.instagram },
                    { l:"YouTube", h:LINKS.anceztro.youtube },
                    { l:"Spotify", h:LINKS.anceztro.spotify },
                    { l:"Linktree", h:LINKS.anceztro.linktree },
                  ].map(s => (
                    <a key={s.l} href={s.h} target="_blank" rel="noopener noreferrer"
                      style={{ display:"block", fontSize:14, color:C.text2, textDecoration:"none", marginBottom:12, transition:"color 0.3s" }}
                      onMouseEnter={e=>e.target.style.color="#fff"} onMouseLeave={e=>e.target.style.color=C.text2}>{s.l}</a>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", paddingTop:32, borderTop:`1px solid ${C.border}`, flexWrap:"wrap", gap:16 }}>
              <p style={{ fontSize:10, letterSpacing:"0.18em", textTransform:"uppercase", color:C.text3 }}>© {new Date().getFullYear()} Anceztral Records. Todos los derechos reservados.</p>
              <p style={{ fontSize:10, color:C.text3 }}>Hecho con pasión en Latinoamérica</p>
            </div>
          </div>
        </footer>
      );
    }

    /* ── APP ── */
    function App() {
      return (
        <div style={{ background:"#000", minHeight:"100vh" }}>
          <Ambient/>
          <Nav/>
          <Hero/>
          <MarqueeStrip/>
          <About/>
          <Services/>
          <Artists/>
          <Catalog/>
          <Social/>
          <CtaBanner/>
          <Contact/>
          <Footer/>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
