  /* REVEAL HOOK */
  function useReveal(threshold = 0.06) {
    const ref = useRef(null);
    const [visible, setVisible] = useState(false);
    
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      
      const observer = new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          observer.unobserve(el);
        }
      }, { threshold });
      
      observer.observe(el);
      return () => observer.disconnect();
    }, [threshold]);
    
    return [ref, visible];
  }

      e.preventDefault();
      setLoading(true);
      
      const formData = new FormData(e.target);
      try {
        await fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            Nombre: formData.get("name"),
            Email: formData.get("email"),
            Servicio: formData.get("service"),
            Mensaje: formData.get("message"),
            _subject: "Nuevo mensaje — Anceztral Records"

        setSent(true);

              }}>✓</div>
              <p className="bebas" style={{ fontSize: "clamp(2rem,4vw,3.5rem)", letterSpacing: "0.03em", marginBottom: 10 }}>MENSAJE ENVIADO</p>
              <p style={{ fontSize: 14, color: C.t2 }}>Te responderemos lo antes posible.</p>
            </div>
          ) : (
            <form onSubmit={handleSubmit} style={{ transition: "all 1.2s 0.2s", opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(22px)" }}>
              <input type="text" name="_honey" style={{ display: "none" }} />
              
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <input name="name" type="text" placeholder="Tu nombre" required style={fieldStyle} onFocus={onFocus} onBlur={onBlur} />
                <input name="email" type="email" placeholder="Email" required style={fieldStyle} onFocus={onFocus} onBlur={onBlur} />
              </div>
              
              <div style={{ position: "relative", marginBottom: 10 }}>
                <select name="service" required style={{ ...fieldStyle, appearance: "none", cursor: "pointer", color: C.t2 }} onFocus={onFocus} onBlur={onBlur}>
                  <option value="" disabled>Servicio requerido</option>
                  <option>Producción Musical</option>
                  <option>Mezcla</option>
                  <option>Mastering</option>
                  <option>Management &amp; Desarrollo</option>
                  <option>Paquete 360°</option>
                  <option>Otro</option>
                </select>
                <span style={{ position: "absolute", right: 18, top: "50%", transform: "translateY(-50%)", color: C.t3, pointerEvents: "none", fontSize: 12 }}>▾</span>
              </div>
              
              <textarea name="message" placeholder="Cuéntanos sobre tu proyecto..." rows={5} required style={{ ...fieldStyle, resize: "none", marginBottom: 18 }} onFocus={onFocus} onBlur={onBlur} />
              
              <button type="submit" disabled={loading} style={{
                width: "100%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 12,
                padding: "19px",
                background: C.red,
                color: "#fff",
                fontFamily: "'Bebas Neue',sans-serif",
                fontSize: 21,
                letterSpacing: "0.15em",
                border: "none",
                cursor: "pointer",
                opacity: loading ? 0.6 : 1,
                transition: "opacity 0.3s"
              }}
                onMouseEnter={e => !loading && (e.currentTarget.style.opacity = "0.84")}
                onMouseLeave={e => !loading && (e.currentTarget.style.opacity = "1")}>
                {loading ? "ENVIANDO..." : "ENVIAR MENSAJE →"}
              </button>
            </form>
          )}
        </div>
      </section>
    );
  }

  /* FOOTER */
  function Footer() {
    return (
      <footer style={{ padding: "clamp(56px,7vw,96px) clamp(20px,5vw,64px) 36px", background: "#000", borderTop: `1px solid ${C.border}` }}>
        <div style={{ maxWidth: 1480, margin: "0 auto" }}>
          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "space-between", alignItems: "flex-start", gap: 44, marginBottom: 52 }}>
            <Logo size={50} showText />
            <div style={{ display: "flex", gap: 64, flexWrap: "wrap" }}>
              <div>
                <p style={{ fontSize: 9, letterSpacing: "0.42em", textTransform: "uppercase", fontWeight: 700, color: C.t3, marginBottom: 20 }}>Navegación</p>
                {["Servicios", "Artistas", "Música", "Contacto"].map(link => (
                  <a key={link} href={`#${link === "Música" ? "catalog" : link.toLowerCase()}`} style={{
                    display: "block",
                    fontSize: 13,
                    color: C.t2,
                    textDecoration: "none",
                    marginBottom: 12,
                    transition: "color 0.3s"
                  }}
                    onMouseEnter={e => e.target.style.color = "#fff"}
                    onMouseLeave={e => e.target.style.color = C.t2}>{link}</a>
                ))}
              </div>
              <div>
                <p style={{ fontSize: 9, letterSpacing: "0.42em", textTransform: "uppercase", fontWeight: 700, color: C.t3, marginBottom: 20 }}>Plataformas</p>
                {[
                  { l: "Instagram", h: LINKS.anceztro.instagram },
                  { l: "YouTube", h: LINKS.anceztro.youtube },
                  { l: "TikTok", h: LINKS.anceztro.tiktok },
                  { l: "Spotify", h: LINKS.anceztro.spotify },
                  { l: "Linktree", h: LINKS.anceztro.linktree }
                ].map(social => (
                  <a key={social.l} href={social.h} target="_blank" rel="noopener noreferrer" style={{
                    display: "block",
                    fontSize: 13,
                    color: C.t2,
                    textDecoration: "none",
                    marginBottom: 12,
                    transition: "color 0.3s"
                  }}
                    onMouseEnter={e => e.target.style.color = "#fff"}
                    onMouseLeave={e => e.target.style.color = C.t2}>{social.l}</a>
                ))}
              </div>
            </div>
          </div>
          
          <div style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            paddingTop: 26,
            borderTop: `1px solid ${C.border}`,
            flexWrap: "wrap",
            gap: 14
          }}>
            <p style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: C.t3 }}>
              © {new Date().getFullYear()} Anceztral Records. Todos los derechos reservados.
            </p>
            <p style={{ fontSize: 10, color: C.t3, letterSpacing: "0.08em" }}>Hecho con pasión en Latinoamérica</p>
          </div>
        </div>
      </footer>
    );
  }

  /* APP */
  function App() {
    return (
      <div style={{ background: "#000", minHeight: "100vh" }}>
        <Nav />
        <Hero />
        <Marquee />
        <About />
        <Services />
        <Artists />
        <Catalog />
        <Social />
        <CtaBanner />
        <Contact />
        <Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
